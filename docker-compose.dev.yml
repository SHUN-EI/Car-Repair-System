# 开发模式：PostgreSQL（含 pgvector）+ Redis，后端在本地运行。
# 向量与关键词检索都在 Postgres 内完成，不再启动 Milvus / etcd / MinIO / Attu。
# 请使用带 pgvector 扩展的镜像；已有 PG16 数据卷一般可以直接挂上来，然后跑 alembic 迁移。
services:
  # PostgreSQL - 关系型数据库（pgvector + tsvector）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maintenance_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-maintenance_db}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - weizhiworks_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d maintenance_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis - 缓存
  redis:
    image: redis:7-alpine
    container_name: maintenance_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  weizhiworks_postgres_data:
    external: true
  redis_data:
